
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>amazon</h2>
        <input type="text" placeholder="Search Amazon">
        <button>Search</button>
        <span>🛒 Cart (<span id="cart-count">0</span>)</span>
    </header>

<nav>
    <a href="#">All</a>
    <a href="#">Mobiles</a>
    <a href="#">Electronics</a>
    <a href="#">Fashion</a>
    <a href="#">Home</a>
    <a href="#">Today's Deals</a>
</nav>

<section class="products">
    <div class="product">
        <img src="mobile.png" alt="Smartphone" width="200">
        <h3>Smartphone</h3>
        <p>Price: ₹15,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="laptop.png" alt="Laptop" width="200">
        <h3>Laptop</h3>
        <p>Price: ₹45,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="headphones.png" alt="Headphones" width="200">
        <h3>Headphones</h3>
        <p>Price: ₹1,499</p>
        <button>Add to Cart</button>
    </div>
</section>

    <h1>Welcome to Amazon Clone</h1>

    <p>My E-Commerce Website</p>
<script src="script.js"></script>
</body>
</html>
